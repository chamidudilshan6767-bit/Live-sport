<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sport</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        .header {
            text-align: center;
            padding: 10px;
        }
        .header h2 {
            margin: 0;
            color: #ffffff;
            font-size: 20px;
        }
        .header p {
            margin: 5px 0 15px 0;
            color: #38bdf8;
            font-size: 12px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: none;
            background-color: #1e293b;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background-color: #161e2e;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .match-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .match-info {
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #00f0ff;
            color: #000000;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .badge {
            background-color: #ef4444;
            color: white;
            padding: 3px 8px;
            font-size: 10px;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Live Sport</h2>
        <p>Powered by Dilshan</p>
    </div>

    <input type="text" class="search-box" placeholder="🔍 Search matches, teams, or channels...">

    <!-- Live Match Card 1 -->
    <div class="card">
        <span class="badge">LIVE</span>
        <div class="match-title">Sri Lanka v Pakistan</div>
        <div class="match-info">League: Final | Status: live</div>
        <a href="#" class="btn">▶ Watch Live Match</a>
    </div>

    <!-- Live Match Card 2 -->
    <div class="card">
        <span class="badge">LIVE</span>
        <div class="match-title">Australia v South Africa</div>
        <div class="match-info">League: 3rd Test | Status: live</div>
        <a href="#" class="btn">▶ Watch Live Match</a>
    </div>

    <!-- Channel Card -->
    <div class="card">
        <span class="badge" style="background-color: #f97316;">24x7 LIVE</span>
        <div class="match-title">Sky Sports Cricket</div>
        <div class="match-info">Category: Cricket</div>
        <a href="#" class="btn" style="background-color: #00f0ff;">Play</a>
    </div>

</body>
</html>
